name: Deploy to GCP

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and deploy API
        run: >-
          gcloud builds submit
          --project "${{ vars.GCP_PROJECT_ID }}"
          --config deployment/gcp/cloudbuild-backend.yaml
          --substitutions
          _REGION="${{ vars.GCP_REGION }}",_SERVICE="${{ vars.CLOUD_RUN_SERVICE }}",_UI_ORIGIN="${{ vars.FIREBASE_HOSTING_ORIGIN }}",_GOOGLE_CLIENT_ID="${{ vars.GOOGLE_CLIENT_ID }}"
          .

      - name: Resolve deployed API URL
        shell: bash
        run: |
          service_url="$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')"
          test -n "$service_url"
          echo "VITE_API_URL=${service_url}/api" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_DEV_AUTH: 'false'
        run: |
          npm ci
          npm run build
      - name: Deploy Firebase Hosting and locked Storage rules
        shell: bash
        run: |
          test -f ui/dist/index.html
          test -f deployment/gcp/storage.rules
          rm -rf deployment/gcp/site
          cp -R ui/dist deployment/gcp/site
          test -f deployment/gcp/site/index.html
          npx --yes firebase-tools@15.28.2 deploy \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --config deployment/gcp/firebase.json \
            --only hosting,storage \
            --non-interactive
