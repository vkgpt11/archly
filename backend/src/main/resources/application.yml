spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/archly;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

archly:
  auth:
    dev-bypass: ${ARCHLY_AUTH_DEV_BYPASS:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:local-development-client-id}
  ui-origins: ${UI_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
